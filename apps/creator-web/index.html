<!DOCTYPE html>
<!-- lang/dir describe the DEFAULT UI, which is Hebrew (LanguageContext overwrites both
     at runtime once a language is chosen). They read "en"/ltr before this, which was
     wrong on first paint for every visitor and told crawlers the wrong content
     language. -->
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!-- Canonical host redirect (change: canonical-host-redirect).
         Firebase serves every site at its default *.web.app / *.firebaseapp.com
         URLs as well as the custom domain, so the console has several working
         front doors. That splits analytics, produces inconsistent shared links,
         and means an origin allow-list has to name all of them. Send the defaults
         to the canonical domain instead.

         FIRST in <head>, before the analytics tag, deliberately: a redirect that
         ran after gtag would record a page_view against the non-canonical
         hostname before leaving it. `location.replace` (not assign) so the
         non-canonical URL never enters history and Back doesn't bounce.
         pathname + search + hash are preserved, so a deep link (e.g. #signin)
         survives the hop. -->
    <script>
      (function () {
        var CANONICAL = {
          'rushpoint-creator.web.app': 'creator.rush-point.com',
          'rushpoint-creator.firebaseapp.com': 'creator.rush-point.com'
        };
        var target = CANONICAL[location.hostname];
        if (target) {
          location.replace('https://' + target + location.pathname + location.search + location.hash);
        }
      })();
    </script>
    <!-- Google tag (gtag.js) — change: google-analytics-tag.
         AFTER <meta charset> on purpose: the charset declaration must stay inside the
         document's first 1024 bytes or encoding detection can fail, and this console is
         Hebrew-first. Google's "immediately after <head>" is guidance for ordinary
         pages, not a constraint — one meta tag later changes nothing about collection.

         Loaded IMPERATIVELY, never as a static <script async src>: a static tag fires
         the request to Google before any JS can decide, so localhost would still be
         contacted. The early return below is what makes "no request at all on a dev
         machine" actually true.

         The host rule duplicates shouldLoadAnalytics() in packages/shared/src/analytics.ts
         because an inline classic script cannot import from the module graph. It is NOT
         trusted: scripts/test-analytics-gate.ts extracts this predicate and executes it
         against the same case table as the shared function, so drift fails `npm test`.
         Change the rule here => change it there (and in play-web/index.html). -->
    <script>
      (function () {
        if (/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)) return;
        var ID = 'G-89TM5X68RR';
        var ID_SECONDARY = 'G-4LELMBZWPZ';
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=' + ID;
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        window.gtag = function () { window.dataLayer.push(arguments); };
        gtag('js', new Date());
        gtag('config', ID, {
          anonymize_ip: true,
          allow_google_signals: false,
          allow_ad_personalization_signals: false
        });
        gtag('config', ID_SECONDARY, {
          anonymize_ip: true,
          allow_google_signals: false,
          allow_ad_personalization_signals: false
        });
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050508" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Favicons. `/favicon.ico` is listed FIRST and must exist as a real file:
         crawlers (Google included) request that exact path by convention before
         reading any <link>, and Firebase's `"source": "**"` SPA rewrite was answering
         it with index.html — a text/html body where an image was expected, which reads
         as "this site has no favicon" and is why the console showed a blank globe in
         search results while the assets themselves were served fine. A static file in
         public/ wins over the rewrite, so adding it is the whole fix.
         The .ico carries 16/32/48 (48 is Google's documented minimum). -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!-- Fonts: preconnect first so the stylesheet request is non-blocking -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@200..800&family=Rubik:wght@300..900&family=JetBrains+Mono:wght@400;500&display=swap" />
    <!-- NO HYPHEN OR DASH may appear in any of the copy below. This is the product's
         UI text standard (change: ui-no-dashes), and page metadata is the copy with
         the WIDEST reach: it is what Google prints. It shipped with em dashes anyway,
         because the standard's gate only scanned the t.* dictionaries and component
         source, and a <title> lives in neither. PART C of scripts/test-no-dashes.ts now
         scans this file plus the manifest, so a dash here fails `npm test`. -->
    <title>בונים משחק שטח אמיתי משלכם, RushPoint</title>
    <meta name="description" content="מעצבים ציד מטמון או מירוץ משימות בכל מקום בעיר, מפעילים משחק חי, והמערכת מנתבת כל קבוצה ומנקדת אותה אוטומטית. בלי לכתוב שורת קוד." />
    <!-- Canonical URL. Firebase serves this console at its *.web.app and
         *.firebaseapp.com defaults too; the inline redirect above sends humans to the
         custom domain, but a crawler that reaches a default host needs this tag to
         attribute the page (and its ranking signals) to one address instead of
         splitting them across three. -->
    <link rel="canonical" href="https://creator.rush-point.com/" />
    <!-- Rich link previews (Open Graph / Twitter) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RushPoint" />
    <meta property="og:url" content="https://creator.rush-point.com/" />
    <meta property="og:locale" content="he_IL" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:title" content="בונים משחק שטח אמיתי משלכם, RushPoint" />
    <meta property="og:description" content="בונים משחק קבוצתי אמיתי בשטח, משתפים קוד הצטרפות אחד, והטבלה החיה מתנקדת לבד." />
    <meta property="og:image" content="https://creator.rush-point.com/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="בונה משחקי השטח של RushPoint" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="בונים משחק שטח אמיתי משלכם, RushPoint" />
    <meta name="twitter:description" content="בונים משחק קבוצתי אמיתי בשטח, משתפים קוד הצטרפות אחד, והטבלה החיה מתנקדת לבד." />
    <meta name="twitter:image" content="https://creator.rush-point.com/og.jpg" />
    <!-- Structured data. Tells Google WHAT this is (a web application, free to start,
         for organising real world team games) rather than leaving it to infer from prose
         it shares a brand name with an unrelated Roblox shooter. `inLanguage` is Hebrew
         because that is the console's default UI. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "RushPoint",
        "url": "https://creator.rush-point.com/",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Any",
        "inLanguage": ["he", "en"],
        "description": "בונים ומריצים משחקי שטח קבוצתיים אמיתיים, ציד מטמון, מירוצי משימות ומשימות עם מיקום, עם ניקוד אוטומטי וטבלה חיה.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "ILS" },
        "featureList": [
          "Visual game builder with staged missions",
          "Live run console with automatic scoring",
          "Join by access code, no install for players",
          "Geolocated tasks, photo and quiz missions",
          "Live leaderboard and shareable results"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
