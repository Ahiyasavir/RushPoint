<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Subtle top-dome gloss for depth (baked ramp, not a blur filter). -->
    <radialGradient id="gloss" cx="256" cy="150" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#39ff14" stop-opacity="0.14"/>
      <stop offset="0.55" stop-color="#39ff14" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#39ff14" stop-opacity="0"/>
    </radialGradient>
    <!-- Faint neon halo behind the reticle -> the mark reads on any crop. -->
    <radialGradient id="halo" cx="256" cy="210" r="190" gradientUnits="userSpaceOnUse">
      <stop offset="0.6" stop-color="#39ff14" stop-opacity="0"/>
      <stop offset="0.85" stop-color="#39ff14" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#39ff14" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed background (OS masks corners for adaptive/maskable icons;
       the icon generator bakes squircle corners into the `any` raster set). -->
  <rect width="512" height="512" fill="#050508"/>
  <rect width="512" height="512" fill="url(#gloss)"/>

  <!-- Centered reticle mark, enlarged to fill the tile while staying inside the
       maskable safe zone (all geometry within radius ~205 of the 256,256 center). -->
  <circle cx="256" cy="210" r="190" fill="url(#halo)"/>
  <circle cx="256" cy="210" r="130" fill="none" stroke="#39ff14" stroke-width="34"/>
  <circle cx="256" cy="210" r="52" fill="#39ff14"/>
  <path d="M256 340 L256 430" stroke="#39ff14" stroke-width="34" stroke-linecap="round"/>
  <path d="M196 430 L316 430" stroke="#39ff14" stroke-width="34" stroke-linecap="round"/>
</svg>
