site:
  name: RushPoint
  # The ONE origin declaration. scripts/lib/marketingSite.ts carries the same
  # value for the test lane, and scripts/test-marketing-output.ts asserts the
  # built output agrees with it. Moving the site is a change HERE plus DNS.
  site: 'https://www.rush-point.com'
  base: '/'
  # TRUE, matching pagePath() in src/utils/i18n.ts. With false the sitemap listed
  # /he while the canonical said /he/, so every sitemap entry pointed at a URL
  # that redirects to the one the page itself claims is canonical.
  trailingSlash: true

  # googleSiteVerificationId: set once the Search Console property exists.

# Default SEO metadata
metadata:
  title:
    default: RushPoint
    # A COMMA, not an em dash. The no dash standard covers page metadata, and a
    # title template applies to every page on the site at once, so one dash here
    # is a dash on every title the site publishes.
    template: '%s, RushPoint'
  description: 'Build a real field game: a route through real places, navigation on the phone, and scoring that takes care of itself.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: RushPoint
    images:
      - url: '~/assets/images/og.jpg'
        width: 1200
        height: 628
    type: website
  twitter:
    # No handle or site. Those were the template author's accounts. A card still
    # renders without them; naming someone else's would be worse than omitting.
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: '/%slug%' # Variables: %slug%, %year%, %month%, %day%, %hour%, %minute%, %second%, %category%
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog' # Blog main path, you can change this to "articles" (/articles)
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category' # Category main path /category/some-category, you can change this to "group" (/group/some-category)
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag' # Tag main path /tag/some-tag, you can change this to "topics" (/topics/some-category)
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null # or "G-XXXXXXXXXX"

ui:
  theme: 'system' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"
