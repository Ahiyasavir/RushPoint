          - { label: 'תגית מעל היתרונות', name: featuresTagline, widget: string }
          - { label: 'כותרת היתרונות', name: featuresTitle, widget: string }
          - { label: 'משפט מתחת לכותרת היתרונות', name: featuresSubtitle, widget: text }
          - label: 'היתרונות'
