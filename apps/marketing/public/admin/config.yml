          - { label: 'משפט מתחת לכותרת', name: subhead, widget: text }
          - { label: 'כפתור ראשי', name: primaryAction, widget: string }
          - { label: 'כפתור משני', name: secondaryAction, widget: string }
          - { label: 'קישור לרעיונות', name: ideasAction, widget: string }

          - label: 'תמונה או סרטון בראש העמוד'
