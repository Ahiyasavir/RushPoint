              - { label: 'מה כתוב לפני שמתחילים', name: startBody, widget: text }
              - { label: 'כפתור התחלה', name: startAction, widget: string }
              - { label: 'כפתור בדיקה', name: checkAction, widget: string }
              - { label: 'כפתור איפוס', name: resetAction, widget: string }
              - { label: 'כפתור לשחק שוב', name: replayAction, widget: string }
