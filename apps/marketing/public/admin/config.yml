              - { label: 'כותרת הסיום', name: doneTitle, widget: string }
              - { label: 'משפט הסיום', name: doneBody, widget: text }
              - { label: 'כפתור בסיום', name: doneAction, widget: string }
              - { label: 'תווית ניקוד', name: doneScoreLabel, widget: string }
              - { label: 'תווית זמן', name: doneTimeLabel, widget: string }
              - { label: 'תווית מקום', name: doneRankLabel, widget: string }
