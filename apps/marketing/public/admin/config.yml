          - { label: 'כותרת השלבים', name: stepsTitle, widget: string }
          - label: 'השלבים'
            name: steps
            widget: list
            fields:
              - { label: 'כותרת', name: title, widget: string }
              - { label: 'תיאור', name: description, widget: text }
              - { label: 'שם האייקון', name: icon, widget: string }
          - { label: 'כותרת הגלריה', name: galleryTitle, widget: string, required: false }
          - { label: 'משפט מתחת לכותרת הגלריה', name: gallerySubtitle, widget: text, required: false }
          - label: 'גלריה: תמונות וסרטונים'
