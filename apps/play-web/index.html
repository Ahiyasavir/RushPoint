<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Google tag (gtag.js) — change: google-analytics-tag.
         AFTER <meta charset> on purpose: the charset declaration must stay inside the
         document's first 1024 bytes or encoding detection can fail, and this app is
         Hebrew-first. Google's "immediately after <head>" is guidance for ordinary
         pages, not a constraint — one meta tag later changes nothing about collection.

         Loaded IMPERATIVELY, never as a static <script async src>: a static tag fires
         the request to Google before any JS can decide, so localhost would still be
         contacted. The early return below is what makes "no request at all on a dev
         machine" actually true.

         The host rule duplicates shouldLoadAnalytics() in packages/shared/src/analytics.ts
         because an inline classic script cannot import from the module graph. It is NOT
         trusted: scripts/test-analytics-gate.ts extracts this predicate and executes it
         against the same case table as the shared function, so drift fails `npm test`.
         Change the rule here => change it there (and in creator-web/index.html). -->
    <script>
      (function () {
        if (/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)) return;
        var ID = 'G-89TM5X68RR';
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=' + ID;
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        window.gtag = function () { window.dataLayer.push(arguments); };
        gtag('js', new Date());
        gtag('config', ID, {
          anonymize_ip: true,
          allow_google_signals: false,
          allow_ad_personalization_signals: false
        });
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F97316" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!-- Fonts: preconnect first so the stylesheet request is non-blocking -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" />
    <title>Join the game — RushPoint</title>
    <meta name="description" content="A live real-world field game — join with a code and play on your phone." />
    <!-- Rich link previews (Open Graph / Twitter) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RushPoint" />
    <meta property="og:url" content="https://rushpoint-play.web.app/" />
    <meta property="og:title" content="Join the game — RushPoint" />
    <meta property="og:description" content="A live real-world field game. Tap to join and play on your phone." />
    <meta property="og:image" content="https://rushpoint-play.web.app/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Join the field game — RushPoint" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Join the game — RushPoint" />
    <meta name="twitter:description" content="A live real-world field game. Tap to join and play on your phone." />
    <meta name="twitter:image" content="https://rushpoint-play.web.app/og.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
