<!DOCTYPE html>
<!-- lang/dir describe the DEFAULT UI, which is Hebrew (App.tsx overwrites both at
     runtime once a language is chosen). "en"/ltr was wrong on first paint for every
     player and told crawlers the wrong content language. -->
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!-- Canonical host redirect (change: canonical-host-redirect).
         Firebase serves every site at its default *.web.app / *.firebaseapp.com
         URLs as well as the custom domain, so the app has several working front
         doors. That splits analytics, produces inconsistent shared links, and
         means an origin allow-list has to name all of them. Send the defaults to
         the canonical domain instead.

         FIRST in <head>, before the analytics tag, deliberately: a redirect that
         ran after gtag would record a page_view against the non-canonical
         hostname before leaving it. `location.replace` (not assign) so the
         non-canonical URL never enters history and Back doesn't bounce.
         pathname + search + hash are preserved, so a deep link such as
         ?game=<id> survives the hop. -->
    <script>
      (function () {
        var CANONICAL = {
          'rushpoint-play.web.app': 'player.rush-point.com',
          'rushpoint-play.firebaseapp.com': 'player.rush-point.com',
          // The apex serves the MARKETING site now (change: marketing-to-apex).
          // Anything that still reaches this app there is a stale front door:
          // an installed pre-v5 TWA, an old bookmark, a printed QR code. Send it
          // to the participant host with its query intact, so a join link that
          // was shared before the move still opens the right game.
          'rush-point.com': 'player.rush-point.com',
          'www.rush-point.com': 'player.rush-point.com'
        };
        var target = CANONICAL[location.hostname];
        if (target) {
          location.replace('https://' + target + location.pathname + location.search + location.hash);
        }
      })();
    </script>
    <!-- Google tag (gtag.js) — change: google-analytics-tag.
         AFTER <meta charset> on purpose: the charset declaration must stay inside the
         document's first 1024 bytes or encoding detection can fail, and this app is
         Hebrew-first. Google's "immediately after <head>" is guidance for ordinary
         pages, not a constraint — one meta tag later changes nothing about collection.

         Loaded IMPERATIVELY, never as a static <script async src>: a static tag fires
         the request to Google before any JS can decide, so localhost would still be
         contacted. The early return below is what makes "no request at all on a dev
         machine" actually true.

         The host rule duplicates shouldLoadAnalytics() in packages/shared/src/analytics.ts
         because an inline classic script cannot import from the module graph. It is NOT
         trusted: scripts/test-analytics-gate.ts extracts this predicate and executes it
         against the same case table as the shared function, so drift fails `npm test`.
         Change the rule here => change it there (and in creator-web/index.html). -->
    <script>
      (function () {
        if (/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)) return;
        var ID = 'G-89TM5X68RR';
        var ID_SECONDARY = 'G-4LELMBZWPZ';
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=' + ID;
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        window.gtag = function () { window.dataLayer.push(arguments); };
        gtag('js', new Date());
        gtag('config', ID, {
          anonymize_ip: true,
          allow_google_signals: false,
          allow_ad_personalization_signals: false
        });
        gtag('config', ID_SECONDARY, {
          anonymize_ip: true,
          allow_google_signals: false,
          allow_ad_personalization_signals: false
        });
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F97316" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Favicons. `/favicon.ico` must exist as a real file: crawlers request that exact
         path by convention, and Firebase's `"source": "**"` SPA rewrite was answering it
         with index.html (text/html where an image was expected). This site happened to
         still get an icon in search results, but it was relying on Google falling back
         to the <link> tags below; the .ico removes that luck. 16/32/48 sizes. -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!-- Fonts: preconnect first so the stylesheet request is non-blocking -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@200..800&family=Rubik:wght@300..900&family=JetBrains+Mono:wght@400;500&display=swap" />
    <!-- NO HYPHEN OR DASH in any copy below (change: ui-no-dashes). Enforced by PART C
         of scripts/test-no-dashes.ts, which exists because em dashes reached the live
         Google result from exactly these fields. -->
    <title>Join a live field game with your access code, RushPoint</title>
    <meta name="description" content="Enter your access code to join a live field game. RushPoint routes your team to real world missions on your phone and scores every stop as you go." />
    <!-- Canonical URL: this site also answers on its *.web.app and *.firebaseapp.com
         defaults, so name the one address that should carry the ranking signals. -->
    <link rel="canonical" href="https://player.rush-point.com/" />
    <!-- Rich link previews (Open Graph / Twitter) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RushPoint" />
    <meta property="og:url" content="https://player.rush-point.com/" />
    <meta property="og:locale" content="he_IL" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:title" content="Join a live field game on RushPoint" />
    <meta property="og:description" content="Tap in with your access code and play a real world team game on your phone." />
    <meta property="og:image" content="https://player.rush-point.com/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Join a RushPoint field game" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Join a live field game on RushPoint" />
    <meta name="twitter:description" content="Tap in with your access code and play a real world team game on your phone." />
    <meta name="twitter:image" content="https://player.rush-point.com/og.jpg" />
    <!-- Structured data. The brand name collides with an unrelated Roblox shooter that
         dominates the query, so state plainly what THIS is: a free web game people play
         outdoors, in Hebrew, no install. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "RushPoint",
        "url": "https://player.rush-point.com/",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Any",
        "inLanguage": ["he", "en"],
        "description": "Join a live real world team field game with an access code. Get routed between geolocated missions on your phone and watch the leaderboard update as your team scores.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "ILS" },
        "browserRequirements": "Requires a modern mobile browser with location access"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
