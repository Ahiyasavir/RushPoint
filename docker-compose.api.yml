# ─── RushPoint API server on the VPS ─────────────────────────────────────────
#
#   docker compose -f docker-compose.api.yml up -d --build
#
# Put your Firebase service-account JSON next to this file as `service-account.json`
# (download from Firebase console → Project settings → Service accounts →
# "Generate new private key"). Fill the env values below, then bring it up.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: rushpoint-api
    restart: always
    # Secrets (RESEND_API_KEY etc.) live in a gitignored .env next to this file,
    # never inline here — see api.env.example for the template.
    env_file:
      - path: ./api.env
        required: false
    # Bind to localhost only and put a TLS reverse proxy (Caddy/nginx) in front —
    # the callable protocol carries Firebase ID tokens and MUST be HTTPS in prod.
    # For a quick test you can expose 8080 directly and use http://<vps-ip>:8080.
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # The Firebase project whose Auth + Firestore this server reads/writes.
      GCLOUD_PROJECT: rushpoint-pwa-7daaa
      # Admin SDK credential (mounted below). Verifies client ID tokens + Firestore.
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/service-account.json
      # Comma-separated browser origins allowed to call this server. MUST match the
      # exact origins your play-web + creator-web are served from (scheme + host).
      # These are the REAL production origins, not placeholders. The gate 403s any
      # browser origin not on this list, so a stale example.com value here takes
      # the whole app down with a CORS failure that looks like a client bug.
      # The canonical domains plus the Firebase default hosts. The defaults now
      # redirect to canonical, but an app installed BEFORE that redirect can still
      # run on a *.web.app origin, and this list is a CORS allowlist rather than a
      # link — narrowing it during an unrelated fix would silently 403 those users.
      # Matches what the VPS was already running.
      ALLOWED_ORIGINS: "https://rush-point.com,https://www.rush-point.com,https://creator.rush-point.com,https://rushpoint-play.web.app,https://rushpoint-creator.web.app,https://rushpoint-play.firebaseapp.com,https://rushpoint-creator.firebaseapp.com"
      PORT: "8080"
      # Run-summary emails (Resend): the on/off flag + sender/recipient defaults
      # live here; the actual RESEND_API_KEY comes from ./api.env (gitignored,
      # see api.env.example) via env_file above so the secret never lands in git.
      RUN_SUMMARY_EMAIL_FROM: "onboarding@resend.dev"
      RUN_SUMMARY_EMAIL_TO: "spendora.tracker@gmail.com"
      # The marketing site's contact form recipient (change: marketing-site). Set
      # explicitly rather than relying on the RUN_SUMMARY_EMAIL_TO fallback in
      # functions/src/contact/notify.ts: the two happen to be the same address
      # today, but a future change to who gets run-summary emails should not
      # silently redirect contact form notifications too.
      CONTACT_NOTIFY_TO: "spendora.tracker@gmail.com"
      # Daily digest (deploy/rushpoint-digest.timer, 03:30 local). It reports the
      # PREVIOUS complete day in RUN_DIGEST_TIMEZONE — set explicitly because a
      # container's local time is UTC even though the host is Asia/Jerusalem, and
      # inheriting that would shift the day boundary and split an evening's runs
      # across two digests. RUN_DIGEST_OWNER_UID is the operator whose runs get
      # itemized; other creators' runs collapse to a bare count so the digest can
      # never become a cross-tenant leak.
      RUN_DIGEST_EMAIL_TO: "spendora.tracker@gmail.com"
      RUN_DIGEST_TIMEZONE: "Asia/Jerusalem"
      # Comma-separated. The operator's real creator account FIRST, then the seeded
      # accounts that own the platform's own demo games — those demo runs are the
      # whole point of the digest, and they are NOT owned by the personal account.
      RUN_DIGEST_OWNER_UID: "wTYDwnEZP6MhGyaGINbumaYqKem1,demo-spy-academy,demo-creator,qa-creator,sansana-creator"
      # NOTE: payments are hard-disabled in code (PAYMENTS_ENABLED=false) — no
      # Stripe/APP_URL/QR env is needed. RUSHPOINT_APP_ID defaults to the project id.
      # Serve repeat reads of game/run/team documents from THIS process's memory instead of
      # re-reading Firestore (change: vps-firestore-read-offload). Only correct because this
      # container is a SINGLE Node process and the sole writer of those documents — which is
      # why it is opt-in rather than the default. Do NOT set it anywhere the API runs as more
      # than one process (the Functions emulator's RuntimeWorkerPool, real Cloud Functions,
      # or any scaled-out deployment): a write in one process cannot invalidate another's
      # copy, and reads would go silently stale mid-game.
      # ⚠️ If this service is ever given `deploy.replicas > 1` or put behind a second
      # container, REMOVE this line first.
      RUSHPOINT_DOC_CACHE: "1"
      # ── The marketing CMS's GitHub sign in (change: marketing-cms-oauth) ────
      # Which pages may be handed a repo-scoped GitHub token by /oauth/callback.
      # Deliberately NARROWER than ALLOWED_ORIGINS above: the CMS lives only on
      # the marketing site, and a token that can write to this repository has no
      # business being posted to the play or creator apps. The *.web.app entry is
      # the marketing Hosting site's default address, which is where the admin
      # page is reachable until www.rush-point.com's DNS is cut over (§12B).
      #
      # The client id and secret come from ./api.env — NOT from this file, which
      # is in git. Without them /oauth answers 503 and nothing else changes.
      OAUTH_ALLOWED_ORIGINS: "https://www.rush-point.com,https://rushpoint-marketing.web.app"
      VPS_UPLOAD_ORIGIN: "https://api.rush-point.com"
      UPLOAD_DIR: "/data/uploads"
    volumes:
      - ./service-account.json:/secrets/service-account.json:ro
      - ./uploads:/data/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8080/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
