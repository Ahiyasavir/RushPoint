# ─── RushPoint API server on the VPS ─────────────────────────────────────────
#
#   docker compose -f docker-compose.api.yml up -d --build
#
# Put your Firebase service-account JSON next to this file as `service-account.json`
# (download from Firebase console → Project settings → Service accounts →
# "Generate new private key"). Fill the env values below, then bring it up.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: rushpoint-api
    restart: always
    # Secrets (RESEND_API_KEY etc.) live in a gitignored .env next to this file,
    # never inline here — see api.env.example for the template.
    env_file:
      - path: ./api.env
        required: false
    # Bind to localhost only and put a TLS reverse proxy (Caddy/nginx) in front —
    # the callable protocol carries Firebase ID tokens and MUST be HTTPS in prod.
    # For a quick test you can expose 8080 directly and use http://<vps-ip>:8080.
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # The Firebase project whose Auth + Firestore this server reads/writes.
      GCLOUD_PROJECT: rushpoint-pwa-7daaa
      # Admin SDK credential (mounted below). Verifies client ID tokens + Firestore.
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/service-account.json
      # Comma-separated browser origins allowed to call this server. MUST match the
      # exact origins your play-web + creator-web are served from (scheme + host).
      # These are the REAL production origins, not placeholders. The gate 403s any
      # browser origin not on this list, so a stale example.com value here takes
      # the whole app down with a CORS failure that looks like a client bug.
      # The canonical domains plus the Firebase default hosts. The defaults now
      # redirect to canonical, but an app installed BEFORE that redirect can still
      # run on a *.web.app origin, and this list is a CORS allowlist rather than a
      # link — narrowing it during an unrelated fix would silently 403 those users.
      # Matches what the VPS was already running.
      ALLOWED_ORIGINS: "https://rush-point.com,https://creator.rush-point.com,https://rushpoint-play.web.app,https://rushpoint-creator.web.app,https://rushpoint-play.firebaseapp.com,https://rushpoint-creator.firebaseapp.com"
      PORT: "8080"
      # Run-summary emails (Resend): the on/off flag + sender/recipient defaults
      # live here; the actual RESEND_API_KEY comes from ./api.env (gitignored,
      # see api.env.example) via env_file above so the secret never lands in git.
      RUN_SUMMARY_EMAIL_FROM: "onboarding@resend.dev"
      RUN_SUMMARY_EMAIL_TO: "8bit7845@gmail.com"
      # NOTE: payments are hard-disabled in code (PAYMENTS_ENABLED=false) — no
      # Stripe/APP_URL/QR env is needed. RUSHPOINT_APP_ID defaults to the project id.
      VPS_UPLOAD_ORIGIN: "https://api.rush-point.com"
      UPLOAD_DIR: "/data/uploads"
    volumes:
      - ./service-account.json:/secrets/service-account.json:ro
      - ./uploads:/data/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8080/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
